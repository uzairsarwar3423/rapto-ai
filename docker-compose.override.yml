version: '3.8'

services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./services/api/src:/app/src:ro

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  mongodb:
    ports:
      - "27017:27017"
