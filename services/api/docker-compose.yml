services:
  api:
    build: .
    image: rapto-ai:latest
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    restart: unless-stopped
    command: ["node", "dist/server.js"]
    networks:
      - app-network

  worker:
    build: .
    image: rapto-ai:latest
    env_file:
      - .env
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    networks:
      - app-network

networks:
  app-network:
    name: rapto-app-network
    external: true
