name: Production CI/CD & Automated VPS Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Custom Image Tag to Deploy'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api

jobs:
  # ============================================================================
  # Stage 1: Docker Multi-Stage Image Build & Container Registry Push
  # ============================================================================
  build-and-push:
    name: 🐳 Build Docker Image & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 🏗️ Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 3: Automated Zero-Downtime VPS Deployment & Rollback Strategy
  # ============================================================================
  deploy:
    name: 🚀 Deploy to VPS & Validate Health
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Set Deployment Image Tag
        id: set-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV
          else
            echo "TAG=${{ github.sha }}" >> $GITHUB_ENV
          fi

      - name: 📡 Deploy to Production VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_TAG: ${{ env.TAG }}
          REPO_NAME: ${{ github.repository }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PROD_DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
          PROD_MONGODB_URL: ${{ secrets.PROD_MONGODB_URL }}
          PROD_REDIS_URL: ${{ secrets.PROD_REDIS_URL }}
          PROD_JWT_ACCESS_SECRET: ${{ secrets.PROD_JWT_ACCESS_SECRET }}
          PROD_JWT_REFRESH_SECRET: ${{ secrets.PROD_JWT_REFRESH_SECRET }}
          PROD_APP_URL: ${{ secrets.PROD_APP_URL }}
          PROD_FRONTEND_URL: ${{ secrets.PROD_FRONTEND_URL }}
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
          PROD_JIRA_CLIENT_ID: ${{ secrets.PROD_JIRA_CLIENT_ID }}
          PROD_JIRA_CLIENT_SECRET: ${{ secrets.PROD_JIRA_CLIENT_SECRET }}
          PROD_JIRA_CALLBACK_URL: ${{ secrets.PROD_JIRA_CALLBACK_URL }}
          PROD_JIRA_WEBHOOK_SECRET: ${{ secrets.PROD_JIRA_WEBHOOK_SECRET }}
          PROD_BREVO_API_KEY: ${{ secrets.PROD_BREVO_API_KEY }}
          PROD_BREVO_FROM_EMAIL: ${{ secrets.PROD_BREVO_FROM_EMAIL }}
          PROD_PADDLE_API_KEY: ${{ secrets.PROD_PADDLE_API_KEY }}
          PROD_PADDLE_CLIENT_TOKEN: ${{ secrets.PROD_PADDLE_CLIENT_TOKEN }}
          PROD_PADDLE_WEBHOOK_SECRET: ${{ secrets.PROD_PADDLE_WEBHOOK_SECRET }}
          PROD_PADDLE_ENVIRONMENT: ${{ secrets.PROD_PADDLE_ENVIRONMENT || 'production' }}
          PROD_PADDLE_PRICE_STARTER_M: ${{ secrets.PROD_PADDLE_PRICE_STARTER_M }}
          PROD_PADDLE_PRICE_STARTER_Y: ${{ secrets.PROD_PADDLE_PRICE_STARTER_Y }}
          PROD_PADDLE_PRICE_GROWTH_M: ${{ secrets.PROD_PADDLE_PRICE_GROWTH_M }}
          PROD_PADDLE_PRICE_GROWTH_Y: ${{ secrets.PROD_PADDLE_PRICE_GROWTH_Y }}
          PROD_PADDLE_PRICE_BUSINESS_M: ${{ secrets.PROD_PADDLE_PRICE_BUSINESS_M }}
          PROD_PADDLE_PRICE_BUSINESS_Y: ${{ secrets.PROD_PADDLE_PRICE_BUSINESS_Y }}
          PROD_AI_PIPELINE_URL: ${{ secrets.PROD_AI_PIPELINE_URL }}
          PROD_AI_PIPELINE_SECRET: ${{ secrets.PROD_AI_PIPELINE_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: TARGET_TAG,REPO_NAME,PROD_DATABASE_URL,PROD_DIRECT_URL,PROD_MONGODB_URL,PROD_REDIS_URL,PROD_JWT_ACCESS_SECRET,PROD_JWT_REFRESH_SECRET,PROD_APP_URL,PROD_FRONTEND_URL,PROD_API_URL,PROD_JIRA_CLIENT_ID,PROD_JIRA_CLIENT_SECRET,PROD_JIRA_CALLBACK_URL,PROD_JIRA_WEBHOOK_SECRET,PROD_BREVO_API_KEY,PROD_BREVO_FROM_EMAIL,PROD_PADDLE_API_KEY,PROD_PADDLE_CLIENT_TOKEN,PROD_PADDLE_WEBHOOK_SECRET,PROD_PADDLE_ENVIRONMENT,PROD_PADDLE_PRICE_STARTER_M,PROD_PADDLE_PRICE_STARTER_Y,PROD_PADDLE_PRICE_GROWTH_M,PROD_PADDLE_PRICE_GROWTH_Y,PROD_PADDLE_PRICE_BUSINESS_M,PROD_PADDLE_PRICE_BUSINESS_Y,PROD_AI_PIPELINE_URL,PROD_AI_PIPELINE_SECRET
          script: |
            set -e
            DEPLOY_DIR="/opt/rapto-system"
            mkdir -p ${DEPLOY_DIR} ${DEPLOY_DIR}/nginx/conf.d ${DEPLOY_DIR}/scripts
            
            # Authenticate VPS Docker to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Safely merge secrets into VPS .env using Python OS environment via quoted heredoc (handles &, /, quotes without sed corruption)
            python3 << 'EOF'
import os

env_path = "/opt/rapto-system/.env"
existing = {}

if os.path.exists(env_path):
    with open(env_path, "r", encoding="utf-8") as f:
        for line in f:
            line_str = line.strip()
            if line_str and not line_str.startswith("#") and "=" in line_str:
                k, v = line_str.split("=", 1)
                existing[k.strip()] = v.strip()

existing["NODE_ENV"] = "production"
existing["PORT"] = "5000"
existing["DOCKER_REGISTRY"] = "ghcr.io"
existing["IMAGE_NAME"] = os.environ.get("REPO_NAME", "") + "/api"
existing["IMAGE_TAG"] = os.environ.get("TARGET_TAG", "latest")

secret_map = {
    "PROD_DATABASE_URL": "DATABASE_URL",
    "PROD_DIRECT_URL": "DIRECT_URL",
    "PROD_MONGODB_URL": "MONGODB_URL",
    "PROD_REDIS_URL": "REDIS_URL",
    "PROD_JWT_ACCESS_SECRET": "JWT_ACCESS_SECRET",
    "PROD_JWT_REFRESH_SECRET": "JWT_REFRESH_SECRET",
    "PROD_APP_URL": "APP_URL",
    "PROD_FRONTEND_URL": "FRONTEND_URL",
    "PROD_API_URL": "API_URL",
    "PROD_JIRA_CLIENT_ID": "JIRA_CLIENT_ID",
    "PROD_JIRA_CLIENT_SECRET": "JIRA_CLIENT_SECRET",
    "PROD_JIRA_CALLBACK_URL": "JIRA_CALLBACK_URL",
    "PROD_JIRA_WEBHOOK_SECRET": "JIRA_WEBHOOK_SECRET",
    "PROD_BREVO_API_KEY": "BREVO_API_KEY",
    "PROD_BREVO_FROM_EMAIL": "BREVO_FROM_EMAIL",
    "PROD_PADDLE_API_KEY": "PADDLE_API_KEY",
    "PROD_PADDLE_CLIENT_TOKEN": "PADDLE_CLIENT_TOKEN",
    "PROD_PADDLE_WEBHOOK_SECRET": "PADDLE_WEBHOOK_SECRET",
    "PROD_PADDLE_ENVIRONMENT": "PADDLE_ENVIRONMENT",
    "PROD_PADDLE_PRICE_STARTER_M": "PADDLE_PRICE_STARTER_M",
    "PROD_PADDLE_PRICE_STARTER_Y": "PADDLE_PRICE_STARTER_Y",
    "PROD_PADDLE_PRICE_GROWTH_M": "PADDLE_PRICE_GROWTH_M",
    "PROD_PADDLE_PRICE_GROWTH_Y": "PADDLE_PRICE_GROWTH_Y",
    "PROD_PADDLE_PRICE_BUSINESS_M": "PADDLE_PRICE_BUSINESS_M",
    "PROD_PADDLE_PRICE_BUSINESS_Y": "PADDLE_PRICE_BUSINESS_Y",
    "PROD_AI_PIPELINE_URL": "AI_PIPELINE_URL",
    "PROD_AI_PIPELINE_SECRET": "AI_PIPELINE_SECRET"
}

for env_var, target_key in secret_map.items():
    val = os.environ.get(env_var, "")
    if val != "":
        existing[target_key] = val

temp_path = env_path + ".tmp"
with open(temp_path, "w", encoding="utf-8") as f:
    for k, v in existing.items():
        f.write(f"{k}={v}\n")

os.replace(temp_path, env_path)
print("✅ VPS .env merged and updated successfully.")
EOF

      - name: 📦 Sync Configuration & Run Deployment Script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: "docker-compose.yml,nginx/,scripts/"
          target: "/opt/rapto-system"

      - name: ⚡ Trigger Zero-Downtime Rollout & Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            cd /opt/rapto-system
            chmod +x scripts/*.sh
            IMAGE_TAG=${{ env.TAG }} ./scripts/deploy.sh
