name: Production CI/CD & Automated VPS Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Custom Image Tag to Deploy'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api

jobs:
  # ============================================================================
  # Stage 1: Integration Tests & Build Verification
  # ============================================================================
  test:
    name: 🧪 Run Automated Tests & Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vocaply_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout Source Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'services/api/package-lock.json'

      - name: 📦 Install API Service Dependencies
        run: npm ci --prefix services/api

      - name: ⚙️ Generate Prisma Client
        run: npm run prisma:generate --prefix services/api
        env:
          DATABASE_URL: "postgresql://postgres:test_password@localhost:5432/vocaply_test?schema=public"
          DIRECT_URL: "postgresql://postgres:test_password@localhost:5432/vocaply_test?schema=public"

      - name: 🔨 Typecheck & Build API TypeScript
        run: npm run build --prefix services/api

      - name: 🧪 Execute Test Suite
        run: npm test --prefix services/api -- --passWithNoTests --runInBand --forceExit
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://postgres:test_password@localhost:5432/vocaply_test?schema=public"
          DIRECT_URL: "postgresql://postgres:test_password@localhost:5432/vocaply_test?schema=public"
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          ENCRYPTION_KEY: "vocaply_ci_encryption_test_key_32_bytes!!"

  # ============================================================================
  # Stage 2: Docker Multi-Stage Image Build & Container Registry Push
  # ============================================================================
  build-and-push:
    name: 🐳 Build Docker Image & Push to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 🏗️ Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 3: Automated Zero-Downtime VPS Deployment & Rollback Strategy
  # ============================================================================
  deploy:
    name: 🚀 Deploy to VPS & Validate Health
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Set Deployment Image Tag
        id: set-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV
          else
            echo "TAG=${{ github.sha }}" >> $GITHUB_ENV
          fi

      - name: 📡 Deploy to Production VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="/opt/rapto-system"
            mkdir -p ${DEPLOY_DIR} ${DEPLOY_DIR}/nginx/conf.d ${DEPLOY_DIR}/scripts
            
            # Authenticate VPS Docker to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Inject secrets into VPS .env file
            cat << 'EOF' > ${DEPLOY_DIR}/.env
            NODE_ENV=production
            PORT=5000
            DOCKER_REGISTRY=ghcr.io
            IMAGE_NAME=${{ github.repository }}/api
            IMAGE_TAG=${{ env.TAG }}

            DATABASE_URL="${{ secrets.PROD_DATABASE_URL }}"
            DIRECT_URL="${{ secrets.PROD_DIRECT_URL }}"
            MONGODB_URL="${{ secrets.PROD_MONGODB_URL }}"
            REDIS_URL="${{ secrets.PROD_REDIS_URL }}"

            JWT_ACCESS_SECRET="${{ secrets.PROD_JWT_ACCESS_SECRET }}"
            JWT_REFRESH_SECRET="${{ secrets.PROD_JWT_REFRESH_SECRET }}"

            APP_URL="${{ secrets.PROD_APP_URL }}"
            FRONTEND_URL="${{ secrets.PROD_FRONTEND_URL }}"
            API_URL="${{ secrets.PROD_API_URL }}"

            JIRA_CLIENT_ID="${{ secrets.PROD_JIRA_CLIENT_ID }}"
            JIRA_CLIENT_SECRET="${{ secrets.PROD_JIRA_CLIENT_SECRET }}"
            JIRA_CALLBACK_URL="${{ secrets.PROD_JIRA_CALLBACK_URL }}"
            JIRA_WEBHOOK_SECRET="${{ secrets.PROD_JIRA_WEBHOOK_SECRET }}"

            BREVO_API_KEY="${{ secrets.PROD_BREVO_API_KEY }}"
            BREVO_FROM_EMAIL="${{ secrets.PROD_BREVO_FROM_EMAIL }}"

            PADDLE_API_KEY="${{ secrets.PROD_PADDLE_API_KEY }}"
            PADDLE_CLIENT_TOKEN="${{ secrets.PROD_PADDLE_CLIENT_TOKEN }}"
            PADDLE_WEBHOOK_SECRET="${{ secrets.PROD_PADDLE_WEBHOOK_SECRET }}"
            PADDLE_ENVIRONMENT="${{ secrets.PROD_PADDLE_ENVIRONMENT || 'production' }}"
            PADDLE_PRICE_STARTER_M="${{ secrets.PROD_PADDLE_PRICE_STARTER_M }}"
            PADDLE_PRICE_STARTER_Y="${{ secrets.PROD_PADDLE_PRICE_STARTER_Y }}"
            PADDLE_PRICE_GROWTH_M="${{ secrets.PROD_PADDLE_PRICE_GROWTH_M }}"
            PADDLE_PRICE_GROWTH_Y="${{ secrets.PROD_PADDLE_PRICE_GROWTH_Y }}"
            PADDLE_PRICE_BUSINESS_M="${{ secrets.PROD_PADDLE_PRICE_BUSINESS_M }}"
            PADDLE_PRICE_BUSINESS_Y="${{ secrets.PROD_PADDLE_PRICE_BUSINESS_Y }}"

            AI_PIPELINE_URL="${{ secrets.PROD_AI_PIPELINE_URL }}"
            AI_PIPELINE_SECRET="${{ secrets.PROD_AI_PIPELINE_SECRET }}"
            EOF

      - name: 📦 Sync Configuration & Run Deployment Script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: "docker-compose.yml,nginx/,scripts/"
          target: "/opt/rapto-system"

      - name: ⚡ Trigger Zero-Downtime Rollout & Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            cd /opt/rapto-system
            chmod +x scripts/*.sh
            IMAGE_TAG=${{ env.TAG }} ./scripts/deploy.sh
