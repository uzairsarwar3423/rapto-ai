name: Production CI/CD & Automated VPS Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Custom Image Tag to Deploy (leave blank to use commit SHA)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api

jobs:
  # ============================================================================
  # Stage 1: Build Docker Image & Push to GHCR
  # ============================================================================
  build-and-push:
    name: 🐳 Build Docker Image & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.resolve-tag.outputs.TAG }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolve image tag ONCE — used by both build and deploy
      - name: 🏷️ Resolve Deployment Image Tag
        id: resolve-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="${{ github.sha }}"
          fi
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "✅ Resolved image tag: ${TAG}"

      - name: 🏷️ Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.resolve-tag.outputs.TAG }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 🏗️ Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 2: Zero-Downtime Deploy to VPS
  # ============================================================================
  deploy:
    name: 🚀 Deploy to VPS & Validate Health
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read   # allows GITHUB_TOKEN to pull from GHCR

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # ── Step 1: Sync deployment files to VPS ─────────────────────────────────
      - name: 📦 Sync Config, NGINX & Scripts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: "docker-compose.yml,nginx/,scripts/"
          target: "/opt/rapto-system"

      # ── Step 2: Create a scoped GHCR deploy token and pass it explicitly ─────
      # NOTE: GITHUB_TOKEN evaluated here in YAML context — arrives as a real
      # value on the remote shell via the envs: list. No PAT needed.
      - name: 📡 Merge Secrets, Pull Image & Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          REPO_NAME: ${{ github.repository }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PROD_DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
          PROD_MONGODB_URL: ${{ secrets.PROD_MONGODB_URL }}
          PROD_REDIS_URL: ${{ secrets.PROD_REDIS_URL }}
          PROD_JWT_ACCESS_SECRET: ${{ secrets.PROD_JWT_ACCESS_SECRET }}
          PROD_JWT_REFRESH_SECRET: ${{ secrets.PROD_JWT_REFRESH_SECRET }}
          PROD_APP_URL: ${{ secrets.PROD_APP_URL }}
          PROD_FRONTEND_URL: ${{ secrets.PROD_FRONTEND_URL }}
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
          PROD_JIRA_CLIENT_ID: ${{ secrets.PROD_JIRA_CLIENT_ID }}
          PROD_JIRA_CLIENT_SECRET: ${{ secrets.PROD_JIRA_CLIENT_SECRET }}
          PROD_JIRA_CALLBACK_URL: ${{ secrets.PROD_JIRA_CALLBACK_URL }}
          PROD_JIRA_WEBHOOK_SECRET: ${{ secrets.PROD_JIRA_WEBHOOK_SECRET }}
          PROD_BREVO_API_KEY: ${{ secrets.PROD_BREVO_API_KEY }}
          PROD_BREVO_FROM_EMAIL: ${{ secrets.PROD_BREVO_FROM_EMAIL }}
          PROD_PADDLE_API_KEY: ${{ secrets.PROD_PADDLE_API_KEY }}
          PROD_PADDLE_CLIENT_TOKEN: ${{ secrets.PROD_PADDLE_CLIENT_TOKEN }}
          PROD_PADDLE_WEBHOOK_SECRET: ${{ secrets.PROD_PADDLE_WEBHOOK_SECRET }}
          PROD_PADDLE_ENVIRONMENT: ${{ secrets.PROD_PADDLE_ENVIRONMENT }}
          PROD_PADDLE_PRICE_STARTER_M: ${{ secrets.PROD_PADDLE_PRICE_STARTER_M }}
          PROD_PADDLE_PRICE_STARTER_Y: ${{ secrets.PROD_PADDLE_PRICE_STARTER_Y }}
          PROD_PADDLE_PRICE_GROWTH_M: ${{ secrets.PROD_PADDLE_PRICE_GROWTH_M }}
          PROD_PADDLE_PRICE_GROWTH_Y: ${{ secrets.PROD_PADDLE_PRICE_GROWTH_Y }}
          PROD_PADDLE_PRICE_BUSINESS_M: ${{ secrets.PROD_PADDLE_PRICE_BUSINESS_M }}
          PROD_PADDLE_PRICE_BUSINESS_Y: ${{ secrets.PROD_PADDLE_PRICE_BUSINESS_Y }}
          PROD_AI_PIPELINE_URL: ${{ secrets.PROD_AI_PIPELINE_URL }}
          PROD_AI_PIPELINE_SECRET: ${{ secrets.PROD_AI_PIPELINE_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          request_pty: true
          command_timeout: "15m"
          envs: >-
            DEPLOY_IMAGE_TAG,REPO_NAME,GHCR_TOKEN,GHCR_USER,
            PROD_DATABASE_URL,PROD_DIRECT_URL,
            PROD_MONGODB_URL,PROD_REDIS_URL,
            PROD_JWT_ACCESS_SECRET,PROD_JWT_REFRESH_SECRET,
            PROD_APP_URL,PROD_FRONTEND_URL,PROD_API_URL,
            PROD_JIRA_CLIENT_ID,PROD_JIRA_CLIENT_SECRET,PROD_JIRA_CALLBACK_URL,PROD_JIRA_WEBHOOK_SECRET,
            PROD_BREVO_API_KEY,PROD_BREVO_FROM_EMAIL,
            PROD_PADDLE_API_KEY,PROD_PADDLE_CLIENT_TOKEN,PROD_PADDLE_WEBHOOK_SECRET,PROD_PADDLE_ENVIRONMENT,
            PROD_PADDLE_PRICE_STARTER_M,PROD_PADDLE_PRICE_STARTER_Y,
            PROD_PADDLE_PRICE_GROWTH_M,PROD_PADDLE_PRICE_GROWTH_Y,
            PROD_PADDLE_PRICE_BUSINESS_M,PROD_PADDLE_PRICE_BUSINESS_Y,
            PROD_AI_PIPELINE_URL,PROD_AI_PIPELINE_SECRET
          script: |
            set -Eeuo pipefail
            DEPLOY_DIR="/opt/rapto-system"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🚀 Rapto AI — VPS Deployment"
            echo "📅 $(date -u)"
            echo "🏷️  Image tag: ${DEPLOY_IMAGE_TAG}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # 1. Authenticate to GHCR using explicit PAT (not GITHUB_TOKEN)
            #    GITHUB_TOKEN is NOT available in SSH context — always use GHCR_PAT
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            echo "✅ GHCR login successful"

            # 2. Ensure scripts are executable and purge any legacy override files
            chmod +x "${DEPLOY_DIR}/scripts/"*.sh
            chmod +x "${DEPLOY_DIR}/scripts/"*.py
            rm -f "${DEPLOY_DIR}/docker-compose.override.yml" "${DEPLOY_DIR}/docker-compose.override.yaml" "${DEPLOY_DIR}/compose.override.yml" "${DEPLOY_DIR}/docker-compose.yaml"

            # 3. Clean up any stale container instance that might hold legacy host port mappings
            docker rm -f rapto-redis 2>/dev/null || true

            # 4. Merge secrets + fix Redis URL → write .env atomically
            TARGET_TAG="${DEPLOY_IMAGE_TAG}" python3 "${DEPLOY_DIR}/scripts/merge-env.py"

            # 5. Execute zero-downtime deployment
            cd "${DEPLOY_DIR}"
            IMAGE_TAG="${DEPLOY_IMAGE_TAG}" bash ./scripts/deploy.sh
