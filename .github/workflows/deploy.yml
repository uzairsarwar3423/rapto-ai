name: Production CI/CD & Automated VPS Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Custom Image Tag to Deploy'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api

jobs:
  # ============================================================================
  # Stage 1: Docker Multi-Stage Image Build & Container Registry Push
  # ============================================================================
  build-and-push:
    name: 🐳 Build Docker Image & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 🏗️ Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 3: Automated Zero-Downtime VPS Deployment & Rollback Strategy
  # ============================================================================
  deploy:
    name: 🚀 Deploy to VPS & Validate Health
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Set Deployment Image Tag
        id: set-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV
          else
            echo "TAG=${{ github.sha }}" >> $GITHUB_ENV
          fi

      - name: 📡 Deploy to Production VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="/opt/rapto-system"
            mkdir -p ${DEPLOY_DIR} ${DEPLOY_DIR}/nginx/conf.d ${DEPLOY_DIR}/scripts
            
            # Authenticate VPS Docker to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            touch ${DEPLOY_DIR}/.env

            # Helper function to update or preserve env vars safely
            update_env() {
              key="$1"
              val="$2"
              if [ -n "$val" ]; then
                if grep -q "^${key}=" "${DEPLOY_DIR}/.env" 2>/dev/null; then
                  sed -i "s|^${key}=.*|${key}=${val}|" "${DEPLOY_DIR}/.env"
                else
                  echo "${key}=${val}" >> "${DEPLOY_DIR}/.env"
                fi
              fi
            }

            # Set deployment metadata
            update_env "NODE_ENV" "production"
            update_env "PORT" "5000"
            update_env "DOCKER_REGISTRY" "ghcr.io"
            update_env "IMAGE_NAME" "${{ github.repository }}/api"
            update_env "IMAGE_TAG" "${{ env.TAG }}"

            # Merge secrets (preserves manual VPS .env keys if GitHub secret is empty)
            update_env "DATABASE_URL" "${{ secrets.PROD_DATABASE_URL }}"
            update_env "DIRECT_URL" "${{ secrets.PROD_DIRECT_URL }}"
            update_env "MONGODB_URL" "${{ secrets.PROD_MONGODB_URL }}"
            update_env "REDIS_URL" "${{ secrets.PROD_REDIS_URL }}"

            update_env "JWT_ACCESS_SECRET" "${{ secrets.PROD_JWT_ACCESS_SECRET }}"
            update_env "JWT_REFRESH_SECRET" "${{ secrets.PROD_JWT_REFRESH_SECRET }}"

            update_env "APP_URL" "${{ secrets.PROD_APP_URL }}"
            update_env "FRONTEND_URL" "${{ secrets.PROD_FRONTEND_URL }}"
            update_env "API_URL" "${{ secrets.PROD_API_URL }}"

            update_env "JIRA_CLIENT_ID" "${{ secrets.PROD_JIRA_CLIENT_ID }}"
            update_env "JIRA_CLIENT_SECRET" "${{ secrets.PROD_JIRA_CLIENT_SECRET }}"
            update_env "JIRA_CALLBACK_URL" "${{ secrets.PROD_JIRA_CALLBACK_URL }}"
            update_env "JIRA_WEBHOOK_SECRET" "${{ secrets.PROD_JIRA_WEBHOOK_SECRET }}"

            update_env "BREVO_API_KEY" "${{ secrets.PROD_BREVO_API_KEY }}"
            update_env "BREVO_FROM_EMAIL" "${{ secrets.PROD_BREVO_FROM_EMAIL }}"

            update_env "PADDLE_API_KEY" "${{ secrets.PROD_PADDLE_API_KEY }}"
            update_env "PADDLE_CLIENT_TOKEN" "${{ secrets.PROD_PADDLE_CLIENT_TOKEN }}"
            update_env "PADDLE_WEBHOOK_SECRET" "${{ secrets.PROD_PADDLE_WEBHOOK_SECRET }}"
            update_env "PADDLE_ENVIRONMENT" "${{ secrets.PROD_PADDLE_ENVIRONMENT || 'production' }}"
            update_env "PADDLE_PRICE_STARTER_M" "${{ secrets.PROD_PADDLE_PRICE_STARTER_M }}"
            update_env "PADDLE_PRICE_STARTER_Y" "${{ secrets.PROD_PADDLE_PRICE_STARTER_Y }}"
            update_env "PADDLE_PRICE_GROWTH_M" "${{ secrets.PROD_PADDLE_PRICE_GROWTH_M }}"
            update_env "PADDLE_PRICE_GROWTH_Y" "${{ secrets.PROD_PADDLE_PRICE_GROWTH_Y }}"
            update_env "PADDLE_PRICE_BUSINESS_M" "${{ secrets.PROD_PADDLE_PRICE_BUSINESS_M }}"
            update_env "PADDLE_PRICE_BUSINESS_Y" "${{ secrets.PROD_PADDLE_PRICE_BUSINESS_Y }}"

            update_env "AI_PIPELINE_URL" "${{ secrets.PROD_AI_PIPELINE_URL }}"
            update_env "AI_PIPELINE_SECRET" "${{ secrets.PROD_AI_PIPELINE_SECRET }}"

      - name: 📦 Sync Configuration & Run Deployment Script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: "docker-compose.yml,nginx/,scripts/"
          target: "/opt/rapto-system"

      - name: ⚡ Trigger Zero-Downtime Rollout & Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            cd /opt/rapto-system
            chmod +x scripts/*.sh
            IMAGE_TAG=${{ env.TAG }} ./scripts/deploy.sh
